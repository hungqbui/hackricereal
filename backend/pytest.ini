[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
markers =
    live: hits the real DineOnCampus API (deselected by default)
    gemini: needs a real GEMINI_API_KEY (deselected by default)
# Offline suite by default; opt in with -m live or -m gemini.
addopts = -m "not live and not gemini" -q
